<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ 汽水盃 | 隊長登入系統</title>
    <style>
        body { font-family: sans-serif; background: #FFF3E0; padding: 20px; text-align: center; }
        .container { max-width: 400px; background: white; padding: 20px; border-radius: 12px; margin: auto; border: 2px solid #FF9800; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        input, select, button { width: 100%; padding: 12px; margin-top: 10px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
        button { background: #FF9800; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #E68A00; }
        .msg { margin-top: 15px; font-weight: bold; line-height: 1.4; }
        .success { color: green; }
        .error { color: red; }
        
        .badge-container { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .sport-badge { background: #FF9800; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        .quota-badge { background: #E53935; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        
        /* Admin 專屬樣式 */
        .admin-mode .sport-badge { background: #333; }
        .admin-mode .quota-badge { background: #4CAF50; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🛠️ 計分控制台</h2>

        <div id="login-section">
            <p>請輸入專屬密碼</p>
            <input type="password" id="pwd" placeholder="輸入密碼...">
            <button onclick="login()">登入</button>
            <div id="login-msg" class="msg error"></div>
        </div>

        <div id="admin-section" class="hidden">
            <div class="badge-container" id="badges">
                <div class="sport-badge" id="current-sport">登入：未知</div>
                <div class="quota-badge" id="current-quota">剩餘額度：計算中...</div>
            </div>
            
            <!-- 只有 Admin 會看到的項目選單 -->
            <select id="admin-sport-select" class="hidden">
                <option value="桌球">桌球</option>
                <option value="排球">排球</option>
                <option value="籃球">籃球</option>
                <option value="足球">足球</option>
                <option value="羽球">羽球</option>
            </select>
            
            <select id="player">
                <option value="">載入選手名單中...</option>
            </select>
            
            <!-- 移除了 min="1"，現在可以輸入負數了！ -->
            <input type="number" id="pts" placeholder="輸入分數 (支援負數扣分)">
            <button onclick="submitScore()">確認送出</button>
            <div id="status" class="msg"></div>
        </div>
    </div>

    <script>
        // ★★★ 請替換成你的 URL ★★★
        const API_URL = 'https://script.google.com/macros/s/AKfycbxaUTepnwwoDFg1FqBDe3XDxXNOjJtIhgbj4JJ0-F6qeydnEt3RwGc7tXQbcKMxYuk/exec';

        const accounts = {
            '0803': '桌球',
            '0817': '排球',   // 男排隊長密碼
            '1113': '排球',   // 女排隊長密碼
            '1018': '籃球',
            '0120': '足球',
            '0506': '羽球'
            'sean1018': 'admin'  // ★ 總籌的最高權限密碼
        };

        let activeSport = ''; 
        let userRole = 'captain'; 

        function login() {
            const pwd = document.getElementById('pwd').value;
            if (accounts[pwd]) {
                activeSport = accounts[pwd];
                
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                
                if (activeSport === 'admin') {
                    userRole = 'admin';
                    document.getElementById('badges').classList.add('admin-mode');
                    document.getElementById('current-sport').innerText = `登入：Admin (最高權限)`;
                    document.getElementById('current-quota').innerText = `權限：無限制`;
                    document.getElementById('admin-sport-select').classList.remove('hidden'); // 顯示跨項目選單
                } else {
                    userRole = 'captain';
                    document.getElementById('current-sport').innerText = `登入項目：${activeSport}`;
                    fetchQuota(); 
                }
                
                loadPlayers();
            } else {
                document.getElementById('login-msg').innerText = '❌ 密碼錯誤，請確認是否輸入正確。';
            }
        }

        async function fetchQuota() {
            if (userRole === 'admin') return; // Admin 不用查額度
            try {
                const response = await fetch(`${API_URL}?action=get_quota&sport=${activeSport}`);
                const result = await response.json();
                if(result.remaining !== undefined) {
                    document.getElementById('current-quota').innerText = `剩餘可用：${result.remaining} 分`;
                }
            } catch (error) {
                document.getElementById('current-quota').innerText = `額度讀取失敗`;
            }
        }

        async function loadPlayers() {
            try {
                const response = await fetch(API_URL + '?action=read');
                const players = await response.json();
                const select = document.getElementById('player');
                select.innerHTML = '<option value="">請選擇選手...</option>'; 
                
                players.forEach(p => {
                    select.innerHTML += `<option value="${p.id}">${p.id} - ${p.name}</option>`;
                });
            } catch (error) {
                document.getElementById('status').innerText = '❌ 無法載入名單，請重新整理網頁。';
                document.getElementById('status').className = 'msg error';
            }
        }

        async function submitScore() {
            const player = document.getElementById('player').value;
            const pts = document.getElementById('pts').value;
            
            // 如果是 admin，以選單選的項目為準；如果是隊長，就以他們的登入項目為準
            const targetSport = (userRole === 'admin') ? document.getElementById('admin-sport-select').value : activeSport;

            if(!player) { alert('請選擇選手！'); return; }
            if(pts === '') { alert('請輸入分數！'); return; }

            const statusEl = document.getElementById('status');
            statusEl.innerText = "⏳ 上傳雲端中...";
            statusEl.className = 'msg';
            
            try {
                // 將 userRole 一併傳給雲端，讓後端知道是不是 Admin 在操作
                const requestUrl = `${API_URL}?action=add&id=${player}&points=${pts}&sport=${targetSport}&role=${userRole}`;
                const response = await fetch(requestUrl);
                const result = await response.json();

                if(result.success) {
                    let actionText = (parseInt(pts) > 0) ? '加上' : '扣除';
                    statusEl.innerText = `✅ 成功為選手在「${targetSport}」${actionText} ${Math.abs(pts)} 分！`;
                    statusEl.className = 'msg success';
                    document.getElementById('pts').value = ''; 
                    
                    if(userRole !== 'admin') {
                        document.getElementById('current-quota').innerText = `剩餘可用：${result.remaining} 分`;
                    }
                } else {
                    statusEl.innerText = `❌ 失敗：${result.error}`;
                    statusEl.className = 'msg error';
                }
            } catch (error) {
                statusEl.innerText = '❌ 網路錯誤，請稍後再試。';
                statusEl.className = 'msg error';
            }
        }
    </script>
</body>
</html>
